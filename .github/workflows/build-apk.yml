name: Android APK

# `on` is quoted so no YAML 1.1 parser treats it as boolean-true.
"on":
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_url:
        description: "Absolute URL of the Aegent relay the APK should hit"
        required: true
        default: "https://aegentweb-production-e18e.up.railway.app"

env:
  # Default target for push builds — set this once to your Railway
  # domain and every commit produces an APK pointed at it.
  DEFAULT_API_URL: "https://aegentweb-production-e18e.up.railway.app"

# softprops/action-gh-release needs write access to create Releases —
# the default GITHUB_TOKEN is read-only. Job-scoped so nothing else
# gets extra rights.
permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('web/android/**/*.gradle*', 'web/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install workspace dependencies
        # Fall back to `npm install` if the lockfile is out of sync, so
        # a new dep landing on main doesn't fail the whole workflow.
        run: npm ci || npm install

      - name: Determine API URL
        id: api
        run: |
          if [ -n "${{ github.event.inputs.api_url }}" ]; then
            echo "url=${{ github.event.inputs.api_url }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=${{ env.DEFAULT_API_URL }}" >> "$GITHUB_OUTPUT"
          fi
          echo "Building APK pointed at: ${{ github.event.inputs.api_url || env.DEFAULT_API_URL }}"

      - name: Build web bundle
        working-directory: web
        env:
          VITE_API_URL: ${{ steps.api.outputs.url }}
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: web
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: web/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          SRC="web/android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$SRC" ]; then
            echo "::error::APK not found at $SRC"
            find web/android/app/build/outputs -type f 2>/dev/null | head -20
            exit 1
          fi
          DST="aegent-${{ github.sha }}.apk"
          cp "$SRC" "$DST"
          echo "path=$DST" >> "$GITHUB_OUTPUT"
          ls -la "$DST"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegent-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish as GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          tag_name: "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}"
          name: "Aegent ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build #{0}', github.run_number) }}"
          body: |
            Debug APK built from ${{ github.sha }}.
            Pointed at API: ${{ steps.api.outputs.url }}
            Install on Android with "Install from unknown sources" enabled.
          draft: false
          prerelease: true
